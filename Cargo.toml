[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/DenisGorbachev/apigen"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "deno.lock",
    "deno.json",
    "clippy.toml",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "nu-lint.toml",
    "nufmt.nuon",
    "rumdl.toml",
    "shuck.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
    "skills-lock.json",
    ".yolobox"
]

[workspace.metadata.details]
name = "apigen"
title = ""
readme = { generate = false }

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
# Rust 1.100 reports redundant fields inside derive macros: https://github.com/rust-lang/rust-clippy/issues/17525.
redundant_field_names = "allow"
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "apigen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = ""
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[package.metadata.details]
title = ""
tagline = ""
summary = ""
announcement = ""
readme = { generate = false }

[lints]
workspace = true

[dependencies]
derive_more = { version = "2.1.1", features = ["full"] }
subtype = { git = "https://github.com/DenisGorbachev/subtype" }
clap = { version = "4.5.11", features = ["derive", "env"] }
errgonomic = { git = "https://github.com/DenisGorbachev/errgonomic" }
thiserror = "2.0.21"
tokio = { version = "1.49.0", features = ["macros", "fs", "net", "rt", "rt-multi-thread"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
quick-xml = { version = "0.39", features = ["serialize"] }
syn = { version = "2.0.117", features = ["parsing", "printing", "full"] }
